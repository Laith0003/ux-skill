[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxskill"
version = "4.0.0b1"
description = "Design intelligence engine for AI coding assistants. Deterministic anti-AI-slop linter (152 rules), mandatory discovery, 5-parallel-search recommender, 1,243 entries across 12 manifests, 160 brand DESIGN specs, MCP server. Runs in Claude Code, Cursor, Windsurf, and 14 more IDEs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Laith Aljunaidy", email = "laith.aljunaidy.laith@gmail.com" }
]
keywords = [
  "ux", "ui", "design-system", "ai-coding", "claude-code", "cursor",
  "windsurf", "linter", "design", "frontend", "anti-ai-slop"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "click>=8.4.2",
  "rich>=15.0.0",
  "pydantic>=2.13.4",
  "tomli>=2.0;python_version<'3.11'"
]

[project.optional-dependencies]
# Optional MCP transport. The upper bound holds until the server moves to
# the mcp 2.x API, which removed the decorators it uses.
mcp = [
  "mcp>=1.28.1,<2"
]
# Render check (`uxskill lint --render`): measures the real layout in
# headless Chromium. Uses installed Google Chrome, else run
# `python -m playwright install chromium` once.
render = [
  "playwright>=1.40"
]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
  "mypy>=2.1.0",
  "black>=25.11.0",
  # Dev only, never a runtime dependency: the contract reader's parity
  # test compares it with a full YAML reader, and skips without one.
  "pyyaml>=6.0.1",
  "mcp>=1.28.1,<2"
]

[project.urls]
Homepage = "https://uxskill.laithjunaidy.com"
Repository = "https://github.com/Laith0003/ux-skill"
Issues = "https://github.com/Laith0003/ux-skill/issues"
Documentation = "https://uxskill.laithjunaidy.com"

[project.scripts]
ux = "engine.cli.main:cli"
uxskill = "engine.cli.main:cli"
ux-mcp = "engine.mcp.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.setuptools.package-data]
"engine" = ["../data/**/*.json"]
"engine.contracts" = ["seed/*.yaml"]
"engine.rulepack" = ["decisions/*.md", "guidance/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
