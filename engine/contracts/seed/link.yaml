# Link: moves to another page or place. Every value is a semantic role.
name: link
status: experimental
category: action
description: Moves a person to another page or place, inside running text or on its own, and reads as a link without relying on color.
parts:
  - {name: text, rtlBehavior: logical}
  - {name: underline, rtlBehavior: logical}
  - {name: icon, rtlBehavior: mirror}
variants:
  - {name: context, values: [inline, standalone], default: inline}
states: [default, hover, focus]
tokens:
  - {part: text, property: text, role: color.text.link}
  - {part: underline, property: border-width, role: border.outline}
  - {part: underline, property: border-color, role: color.line.accent}
  - {part: underline, property: border-width, role: border.emphasis, state: hover}
  - {part: text, property: font, role: type.text.ui, when: {context: standalone}}
  - {part: text, property: min-size, role: layout.target.min, when: {context: standalone}}
  - {part: text, property: focus-ring, role: color.focus.ring, state: focus}
  - {part: text, property: focus-ring-width, role: border.focus-ring.width, state: focus}
  - {part: text, property: focus-ring-offset, role: border.focus-ring.offset, state: focus}
contrast:
  - {fg: color.text.link, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.line.accent, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.focus.ring, bg: surfaces, minimum: 3, criterion: "1.4.11"}
surfaces: [color.surface.page, color.surface.card, color.surface.raised, color.surface.sunken]
a11y:
  target: layout.target.min
  label: localized
  cue: every link is underlined, so it reads as a link without its color
copy:
  default:
    - The link text says where it goes or what happens, such as Read the pricing guide, never Click here or Learn more alone
    - A link that opens a file or leaves the site says so in its text
usage:
  do:
    - Underline every link; inline links take the text's size and are exempt from the target minimum inside a sentence (WCAG 2.5.8), standalone links meet it
    - Let an arrow icon point to the end of the line, so it flips under right to left
    - Apply the binding for a state over the one without a state, then, among those, the one with more variant conditions over the one with fewer
  dont:
    - Do not use a link to start an action that changes data; use a button
    - Do not remove the underline on hover or rely on color to mark a link
provenance:
  figma: {node: null, variantCount: null, lastVerified: null}
  drift: []
