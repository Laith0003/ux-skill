# Checkbox: one yes or no choice, or one of several independent choices.
# Every value is a semantic role.
name: checkbox
status: experimental
category: selection
description: Turns one independent option on or off, with a label beside the box; several checkboxes let a person choose any number of options.
parts:
  - {name: box, rtlBehavior: logical}
  - {name: mark, rtlBehavior: fixed}
  - {name: label, rtlBehavior: logical}
  - {name: helper, rtlBehavior: logical}
  - {name: message, rtlBehavior: logical}
  - {name: target, rtlBehavior: logical}
variants:
  - {name: checked, values: ["off", "on", mixed], default: "off"}
states: [default, hover, focus, disabled, error]
tokens:
  - {part: box, property: fill, role: color.surface.card}
  - {part: box, property: border-width, role: border.emphasis}
  - {part: box, property: border-color, role: color.line.input}
  # the box is a small square at the control icon size; the target wraps
  # the box and its label
  - {part: box, property: radius, role: radius.box}
  - {part: box, property: min-size, role: type.icon.size.control}
  - {part: target, property: min-size, role: layout.target.min}
  - {part: target, property: gap, role: space.control.gap}
  - {part: box, property: fill, role: color.action.primary, when: {checked: "on"}}
  - {part: box, property: border-color, role: color.line.selected, when: {checked: "on"}}
  - {part: mark, property: icon, role: color.text.on-action, when: {checked: "on"}}
  - {part: box, property: fill, role: color.action.primary, when: {checked: mixed}}
  - {part: box, property: border-color, role: color.line.selected, when: {checked: mixed}}
  - {part: mark, property: icon, role: color.text.on-action, when: {checked: mixed}}
  - {part: label, property: text, role: color.text.default}
  - {part: label, property: font, role: type.text.body}
  - {part: helper, property: text, role: color.text.default}
  - {part: helper, property: font, role: type.text.body-small}
  - {part: helper, property: stack-gap, role: space.field.message-gap}
  - {part: box, property: fill, role: color.action.primary-hover, when: {checked: "on"}, state: hover}
  - {part: box, property: fill, role: color.action.primary-hover, when: {checked: mixed}, state: hover}
  - {part: box, property: fill, role: color.surface.sunken, when: {checked: "off"}, state: hover}
  - {part: box, property: focus-ring, role: color.focus.ring, state: focus}
  - {part: box, property: focus-ring-width, role: border.focus-ring.width, state: focus}
  - {part: box, property: focus-ring-offset, role: border.focus-ring.offset, state: focus}
  - {part: box, property: border-color, role: color.line.danger, state: error}
  - {part: message, property: text, role: color.status.danger.text, state: error}
  - {part: message, property: font, role: type.text.body-small, state: error}
  - {part: message, property: stack-gap, role: space.field.message-gap, state: error}
  - {part: box, property: fill, role: color.action.disabled, state: disabled}
  - {part: box, property: border-color, role: color.text.disabled, state: disabled}
  - {part: mark, property: icon, role: color.text.disabled, state: disabled}
  - {part: label, property: text, role: color.text.disabled, state: disabled}
contrast:
  - {fg: color.line.input, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.input, bg: color.surface.sunken, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.selected, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.text.on-action, bg: color.action.primary, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.text.on-action, bg: color.action.primary-hover, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.line.danger, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.text.default, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.status.danger.text, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.focus.ring, bg: surfaces, minimum: 3, criterion: "1.4.11"}
surfaces: [color.surface.page, color.surface.card, color.surface.raised]
a11y:
  target: layout.target.min
  label: localized
  cue: a check mark or a dash inside the box shows the state, never the fill alone
copy:
  default:
    - The label states what is true when the box is checked, as a positive statement
    - Keep the label to one line; put the detail in helper text
  error:
    - Say what must be checked and why, such as Agree to the terms to continue
usage:
  do:
    - Let the whole label toggle the box, so the target part wraps the box and its label and meets the target size, while the box stays at the control icon size
    - Draw the checked box's edge in color.line.selected, which clears 3:1 on every surface the box sits on; the fill is the brand, and the mark on it clears 4.5:1
    - Use mixed only for a box that checks a group, when some of the group are checked
    - Stack checkboxes at the list gap, one per line
    - A disabled component takes no hover or pressed binding; a disabled component that can take focus keeps its focus ring; selected and error still apply, and where disabled and another state bind the same part and property, disabled wins. Apply this first, then the specificity rule
    - Apply the binding for a state over the one without a state, then, among those, the one with more variant conditions over the one with fewer
    - When two states apply at once, hover changes the box's fill and error its edge, so both show
  dont:
    - Do not use a checkbox for a choice that takes effect at once; use a toggle
    - Do not write a label as a question
    - Do not submit when a box is checked; wait for the form's action
provenance:
  figma: {node: null, variantCount: null, lastVerified: null}
  drift: []
