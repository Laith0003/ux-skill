a11y:
  target: layout.target.min
  label: localized
  cue: the chosen day has a heavier edge and a tint, and an error adds a message, never color alone
copy:
  default:
    - The label names the date, such as Date of birth; the helper text shows the format with a real example
    - Month and day names follow the page's language and market
  error:
    - Name the field, the problem and an example that works, such as Enter the date as 25/09/2026
usage:
  do:
    - Let people type the date; the calendar is a help, not the only way in
    - Keep the typed value left to right inside a right to left form, and flip the previous and next arrows
    - Start the week on the day the market starts it
    - A disabled component takes no hover or pressed binding; a disabled component that can take focus keeps its focus ring; selected and error still apply, and where disabled and another state bind the same part and property, disabled wins. Apply this first, then the specificity rule
    - Apply the binding for a state over the one without a state, then, among those, the one with more variant conditions over the one with fewer
    - When two states apply at once, selected wins over hover on a day, and error wins over hover on the field
  dont:
    - Do not use three selects for day, month and year when people know the date
    - Do not hide the format until after an error
