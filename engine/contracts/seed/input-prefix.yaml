# Input with a prefix: a field joined to a fixed part, such as a country
# code or a currency. Every value is a semantic role.
name: input-prefix
status: experimental
category: input
description: Joins a fixed part, such as a dialing code or a currency, to a text field, so a person types only the rest of the value.
parts:
  - {name: group, rtlBehavior: logical}
  - {name: prefix, rtlBehavior: fixed}
  - {name: input, rtlBehavior: fixed}
  - {name: label, rtlBehavior: logical}
  - {name: message, rtlBehavior: logical}
variants:
  - {name: position, values: [start, end], default: start}
states: [default, hover, focus, disabled, error]
tokens:
  - {part: label, property: text, role: color.text.default}
  - {part: label, property: font, role: type.text.ui-large}
  - {part: label, property: stack-gap, role: space.field.label-gap}
  - {part: group, property: border-width, role: border.outline}
  - {part: group, property: border-color, role: color.line.input}
  - {part: group, property: radius, role: radius.control}
  - {part: group, property: min-size, role: layout.target.min}
  # the shared edge between the prefix and the field is square
  - {part: prefix, property: radius, role: radius.joined}
  - {part: prefix, property: fill, role: color.surface.sunken}
  - {part: prefix, property: border-width, role: border.outline}
  - {part: prefix, property: border-color, role: color.line.input}
  - {part: prefix, property: text, role: color.text.muted}
  - {part: prefix, property: font, role: type.text.body}
  - {part: prefix, property: padding-inline, role: space.control.padding-inline}
  - {part: input, property: radius, role: radius.joined}
  - {part: input, property: fill, role: color.surface.card}
  - {part: input, property: border-width, role: border.outline}
  - {part: input, property: border-color, role: color.line.input}
  - {part: input, property: text, role: color.text.default}
  - {part: input, property: font, role: type.text.body}
  - {part: input, property: padding-inline, role: space.control.padding-inline}
  - {part: input, property: padding-block, role: space.control.padding-block}
  - {part: group, property: border-width, role: border.emphasis, state: hover}
  - {part: group, property: focus-ring, role: color.focus.ring, state: focus}
  - {part: group, property: focus-ring-width, role: border.focus-ring.width, state: focus}
  - {part: group, property: focus-ring-offset, role: border.focus-ring.offset, state: focus}
  - {part: group, property: border-width, role: border.emphasis, state: error}
  - {part: group, property: border-color, role: color.line.danger, state: error}
  - {part: message, property: text, role: color.status.danger.text, state: error}
  - {part: message, property: font, role: type.text.body-small, state: error}
  - {part: message, property: stack-gap, role: space.field.message-gap, state: error}
  - {part: input, property: fill, role: color.surface.sunken, state: disabled}
  - {part: input, property: text, role: color.text.disabled, state: disabled}
  - {part: prefix, property: text, role: color.text.disabled, state: disabled}
  - {part: group, property: border-color, role: color.line.subtle, state: disabled}
contrast:
  - {fg: color.line.input, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.input, bg: color.surface.card, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.input, bg: color.surface.sunken, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.danger, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.text.default, bg: color.surface.card, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.text.muted, bg: color.surface.sunken, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.text.default, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.status.danger.text, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.focus.ring, bg: surfaces, minimum: 3, criterion: "1.4.11"}
surfaces: [color.surface.page, color.surface.card, color.surface.raised]
a11y:
  target: layout.target.min
  label: localized
  cue: an error adds a heavier edge and a message, never color alone
copy:
  default:
    - The prefix is the fixed part exactly as it is written, such as +962 or USD, and is part of the accessible name
    - The label names the whole value, such as Mobile number
  error:
    - Name what is wrong with the part the person typed and give the fix, such as Enter the 9 digits after +962
usage:
  do:
    - Keep the prefix and the value left to right inside a right to left form, with white-space nowrap, and keep the prefix on the side where it is read
    - Put a currency after the amount when the market writes it that way, with position end
    - Round only the outer corners of the group; the shared edge takes radius.joined
    - A disabled component takes no hover or pressed binding; a disabled component that can take focus keeps its focus ring; selected and error still apply, and where disabled and another state bind the same part and property, disabled wins. Apply this first, then the specificity rule
    - Apply the binding for a state over the one without a state, then, among those, the one with more variant conditions over the one with fewer
    - When two states apply at once, error wins over hover
  dont:
    - Do not let people type the prefix again in the field
    - Do not split a phone number into several fields
provenance:
  figma: {node: null, variantCount: null, lastVerified: null}
  drift: []
