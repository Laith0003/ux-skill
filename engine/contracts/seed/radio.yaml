# Radio: one choice from a short, visible set. Every value is a semantic role.
name: radio
status: experimental
category: selection
description: Lets a person choose exactly one option from a short set that is all visible at once, with a label beside each dot.
parts:
  - {name: dot, rtlBehavior: logical}
  - {name: mark, rtlBehavior: fixed}
  - {name: label, rtlBehavior: logical}
  - {name: legend, rtlBehavior: logical}
  - {name: message, rtlBehavior: logical}
  - {name: target, rtlBehavior: logical}
variants:
  - {name: chosen, values: ["off", "on"], default: "off"}
states: [default, hover, focus, disabled, error]
tokens:
  - {part: dot, property: fill, role: color.surface.card}
  - {part: dot, property: border-width, role: border.emphasis}
  - {part: dot, property: border-color, role: color.line.input}
  - {part: dot, property: radius, role: radius.pill}
  # the dot is drawn at the control icon size; the target wraps the dot
  # and its label
  - {part: dot, property: min-size, role: type.icon.size.control}
  - {part: target, property: min-size, role: layout.target.min}
  - {part: target, property: gap, role: space.control.gap}
  - {part: dot, property: border-color, role: color.line.selected, when: {chosen: "on"}}
  - {part: mark, property: icon, role: color.line.selected, when: {chosen: "on"}}
  - {part: label, property: text, role: color.text.default}
  - {part: label, property: font, role: type.text.body}
  - {part: legend, property: text, role: color.text.default}
  - {part: legend, property: font, role: type.text.ui-large}
  - {part: legend, property: stack-gap, role: space.field.label-gap}
  - {part: dot, property: fill, role: color.surface.sunken, state: hover}
  - {part: dot, property: focus-ring, role: color.focus.ring, state: focus}
  - {part: dot, property: focus-ring-width, role: border.focus-ring.width, state: focus}
  - {part: dot, property: focus-ring-offset, role: border.focus-ring.offset, state: focus}
  - {part: dot, property: border-color, role: color.line.danger, state: error}
  - {part: message, property: text, role: color.status.danger.text, state: error}
  - {part: message, property: font, role: type.text.body-small, state: error}
  - {part: message, property: stack-gap, role: space.field.message-gap, state: error}
  - {part: dot, property: fill, role: color.surface.sunken, state: disabled}
  - {part: dot, property: border-color, role: color.text.disabled, state: disabled}
  - {part: mark, property: icon, role: color.text.disabled, state: disabled}
  - {part: label, property: text, role: color.text.disabled, state: disabled}
contrast:
  - {fg: color.line.input, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.input, bg: color.surface.sunken, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.selected, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.selected, bg: color.surface.sunken, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.selected, bg: color.surface.card, minimum: 3, criterion: "1.4.11"}
  - {fg: color.line.danger, bg: surfaces, minimum: 3, criterion: "1.4.11"}
  - {fg: color.text.default, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.status.danger.text, bg: surfaces, minimum: 4.5, criterion: "1.4.3"}
  - {fg: color.focus.ring, bg: surfaces, minimum: 3, criterion: "1.4.11"}
surfaces: [color.surface.page, color.surface.card, color.surface.raised]
a11y:
  target: layout.target.min
  label: localized
  cue: the chosen option shows a filled dot, never a color change alone
copy:
  default:
    - The legend asks for the choice in a short phrase; each label names one option
    - Options are parallel in form and in a stable order
  error:
    - Say that a choice is needed and what it is for, such as Choose a delivery time
usage:
  do:
    - Use radio buttons for two to five options that all fit on screen; for more, use a select
    - Group the options in a fieldset with the legend as its first child
    - Let the whole label choose the option, so the target part wraps the dot and its label and meets the target size, while the dot stays at the control icon size
    - Choose a default only when one option is right for most people
    - A disabled component takes no hover or pressed binding; a disabled component that can take focus keeps its focus ring; selected and error still apply, and where disabled and another state bind the same part and property, disabled wins. Apply this first, then the specificity rule
    - Apply the binding for a state over the one without a state, then, among those, the one with more variant conditions over the one with fewer
    - When two states apply at once, error sets the dot's edge and hover its fill, so both show; a chosen dot in error keeps its mark
  dont:
    - Do not use a single radio button; use a checkbox
    - Do not submit when an option is chosen
provenance:
  figma: {node: null, variantCount: null, lastVerified: null}
  drift: []
