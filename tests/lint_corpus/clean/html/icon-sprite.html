<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display: none">
  <symbol id="icon-truck" viewBox="0 0 24 24">
    <path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z" fill="none" stroke="currentColor" stroke-width="1.5" />
    <circle cx="7" cy="17" r="1.5" />
    <circle cx="17" cy="17" r="1.5" />
  </symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5" />
    <path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.5" />
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="M5 12l4 4 10-10" fill="none" stroke="currentColor" stroke-width="1.5" />
  </symbol>
</svg>

<ul class="feature-list">
  <li class="feature-list__item">
    <svg class="icon" aria-hidden="true" width="20" height="20"><use href="#icon-truck"></use></svg>
    Routes rebuild when a driver calls in sick.
  </li>
  <li class="feature-list__item">
    <svg class="icon" aria-hidden="true" width="20" height="20"><use href="#icon-clock"></use></svg>
    Arrival windows update from live GPS every two minutes.
  </li>
  <li class="feature-list__item">
    <svg class="icon" aria-hidden="true" width="20" height="20"><use href="#icon-check"></use></svg>
    Proof of delivery includes a photo, signature and timestamp.
  </li>
</ul>

<p class="status-line">
  <svg role="img" aria-label="On schedule" width="12" height="12" viewBox="0 0 12 12">
    <circle cx="6" cy="6" r="5" fill="var(--positive)" />
  </svg>
  All depots reporting
</p>
