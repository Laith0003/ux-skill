<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Freightline</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth">
  <main id="main" class="auth__panel">
    <h1 class="auth__title">Sign in</h1>
    <form method="post" action="/session" class="auth__form">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-help">
        <p id="password-help" class="field__hint"><a href="/password/reset">Reset your password</a></p>
      </div>
      <label class="checkbox">
        <input type="checkbox" name="remember" value="1">
        Keep me signed in on this device
      </label>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <p class="auth__switch">New to Freightline? <a href="/signup">Create an account</a></p>
  </main>
</body>
</html>
