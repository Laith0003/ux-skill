<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عيادة النخيل لطب الأسنان</title>
  <style>
    :root {
      --font-body: "IBM Plex Sans Arabic", "Noto Naskh Arabic", system-ui, sans-serif;
      --ink: #1c1917;
      --ink-muted: #57534e;
      --line: #e7e5e4;
      --accent: #0f766e;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      line-height: 1.8;
      color: var(--ink);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 2.5rem;
      padding-block: 4rem;
      padding-inline: clamp(1rem, 5vw, 4rem);
    }

    .hero h1 {
      font-size: clamp(2rem, 1.5rem + 2vw, 3rem);
      line-height: 1.3;
    }

    .cta {
      display: inline-block;
      padding-block: 0.75rem;
      padding-inline: 1.25rem;
      margin-inline-end: 0.75rem;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }

    .cta:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .hours {
      border-inline-start: 3px solid var(--accent);
      padding-inline-start: 1rem;
    }

    @media (max-width: 48rem) {
      .hero {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <h1>ابتسامة صحية بمواعيد تناسب يومك</h1>
        <p>نستقبلكم في عبدون من السبت إلى الخميس. الكشف الأول يشمل صورة أشعة بانورامية وخطة علاج مكتوبة.</p>
        <a class="cta" href="/ar/book">احجز موعد الكشف الأول</a>
        <a href="tel:+96265550142" dir="ltr">+962 6 555 0142</a>
      </div>
      <img src="/media/clinic-reception.avif" alt="استقبال العيادة مع مقاعد الانتظار" width="960" height="720">
    </section>
    <section class="hours" aria-labelledby="hours-title">
      <h2 id="hours-title">ساعات العمل</h2>
      <p>السبت إلى الخميس، من ٩ صباحاً حتى ٧ مساءً. الجمعة مغلق.</p>
    </section>
  </main>
</body>
</html>
