<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>Page</title></head>
<body>
<form action="/subscribe" method="post">
  <label for="email">Work email</label>
  <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email">

</form>
<p>The label sits after the form in source order below, and still names the field.</p>
<form action="/search">

  <label for="q">Search the help center</label>
</form>
</body>
</html>
