<style>
.table td { border-bottom: 1px solid var(--color-line-subtle); }
.card { border: 1px solid var(--color-line-subtle); }
.card--featured::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 0; block-size: 3px; background: var(--accent); }
.frame::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--color-line-subtle); }
.tab[aria-selected="true"]::after { content: ""; block-size: 2px; inline-size: 100%; background: var(--accent); }
.nav a::after { content: ""; height: 2px; width: 0; transition: width 200ms; background: currentColor; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.legend-item::before { content: ""; width: 12px; height: 12px; background: var(--series-1); }
.tooltip::after { content: ""; border: 6px solid transparent; border-top-color: var(--ink); }
.check::after { content: ""; width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.burger::before { content: ""; position: absolute; top: -7px; width: 22px; height: 2px; background: currentColor; }
.or-divider::before { content: ""; flex: 1; height: 1px; background: var(--color-line-subtle); }
.crumbs li + li::before { content: ""; display: inline-block; width: 1px; height: 1em; background: var(--color-line-subtle); }
.eyebrow { letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-accent); }
.quote { border-inline-start: 3px solid var(--accent); padding-inline-start: 1rem; }
.eyebrow--ruled::after { content: ""; display: block; width: 100%; height: 1px; background: var(--color-line-subtle); }
.eyebrow--secure::before { content: ""; width: 16px; height: 16px; background: currentColor; mask: url(icons/lock.svg) center / contain no-repeat; }
</style>
<section>
  <p class="eyebrow">Plain eyebrow</p>
  <h2>Section title</h2>
  <hr>
  <table class="table"><tr><td>A</td><td>B</td></tr></table>
  <p class="eyebrow"><i class="fa-solid fa-bolt" aria-hidden="true"></i>Fast</p>
  <p class="eyebrow">Call us on <span class="ltr" data-slot="phone"></span></p>
  <button class="burger" aria-label="Menu"><span></span></button>
  <span class="dot"></span><span>Online</span>
  <table><thead><tr><th class="px-4 text-xs uppercase tracking-wider border-l">Plan</th><th class="text-xs uppercase tracking-wide">Name <span class="sort"></span></th></tr></thead></table>
  <span class="inline-flex rounded-full px-2 text-xs uppercase tracking-wide"><span class="size-1.5 rounded-full bg-green-500"></span>Active</span>
  <a class="block border-l-2 border-indigo-600 pl-3 text-xs uppercase tracking-wider" href="/docs">Getting started</a>
</section>
