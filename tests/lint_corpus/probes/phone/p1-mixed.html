<form>
  <input type="tel" name="a" pattern="\+[0-9]+">
  <input type="tel" name="b" pattern="\+?[0-9]+">
  <input type="tel" name="c">
  <input name="d" pattern="^\+\d{12}$" type="tel">
  <input type="text" name="e" pattern="\+[0-9]+">
  <input type='tel' name='f' pattern='[0-9+ ]{7,}'>
  <input type="tel" name="g" pattern="&#92;+[0-9]{9,}">
  <input type="tel" name="h" pattern="(\+|00)[1-9][0-9]{7,14}">
</form>
