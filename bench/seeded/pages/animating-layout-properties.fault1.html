<head>
<meta charset="utf-8">

<title>Seeded page animating-layout-properties.fault1</title>
<style>
body { margin: 0; color: #1a1a1a; background: #ffffff; line-height: 1.5; }
main { max-width: 40rem; margin: 0 auto; padding: 1.5rem; }
