<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Showcase card source for the editorial wing, 1200x630.
     Render: node scripts/render-og.mjs scripts/og-editorial.html docs/og/editorial.png 1200 630 1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* the site's tokens (docs/index.html :root) */
  :root{--black:#06070a;--ink:#f4f5f7;--body:#a6abb3;--muted:#717783;--cyan:#22d3ee;--hair:rgba(255,255,255,.11);
    --serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--black)}
  /* side padding keeps the content inside a 16:10 center crop (the showcase card) */
  .card{width:1200px;height:630px;padding:56px 116px;display:grid;grid-template-columns:400px 1fr;gap:40px;
    color:var(--ink);font-family:var(--sans)}
  .text{display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
  .rule{height:1px;background:var(--hair);margin:18px 0 0}
  h1{font-family:var(--serif);font-weight:500;font-size:56px;line-height:1.02;letter-spacing:-.015em;
    font-variation-settings:'opsz' 144}
  h1 em{font-style:italic;color:var(--body)}
  .dek{font-size:17px;line-height:1.55;color:var(--body);max-width:36ch;margin-top:20px}
  .meta{display:flex;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .plates{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
  figure{position:relative;overflow:hidden;border-radius:4px}
  figure.lead{grid-row:1 / span 2}
  figure img{display:block;width:100%;height:100%;object-fit:cover}
  figcaption{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:#fff;background:rgba(6,7,10,.62);padding:4px 7px}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div>
      <p class="kicker">ux-skill · editorial wing</p>
      <div class="rule"></div>
    </div>
    <div>
      <h1>The long read, set like a <em>magazine.</em></h1>
      <p class="dek">Wide-tracked display type, a magazine grid, and photographic plates in place of icons.</p>
    </div>
    <p class="meta"><span>Fraunces</span><span>Inter</span><span>JetBrains Mono</span></p>
  </div>
  <div class="plates">
    <figure class="lead"><img src="assets/editorial/editorial-9.jpg" width="1600" height="1000" alt=""><figcaption>Plate 01</figcaption></figure>
    <figure><img src="assets/editorial/editorial-2.jpg" width="1600" height="1000" alt=""><figcaption>Plate 02</figcaption></figure>
    <figure><img src="assets/editorial/editorial-apple-woman-coffee.jpg" width="1800" height="1100" alt=""><figcaption>Plate 03</figcaption></figure>
  </div>
</div>
</body>
</html>
